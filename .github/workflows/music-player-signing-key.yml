name: Music player signing key (one-time setup)

# Run once, by hand, after adding the SIGNING_PASSPHRASE repository secret.
# Makes Isaialai's private signing key, records the move from the old public
# key to it (so phones update without uninstalling), and commits the key
# encrypted with that passphrase. See music-player-android/SECURITY.md.

on:
  workflow_dispatch:
  # Also on edits to this file (so the workflow is registered on a branch before it's merged).
  # A push run just skips until the secret is set.
  push:
    paths:
      - ".github/workflows/music-player-signing-key.yml"

concurrency:
  group: music-player-signing-key
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  make-key:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-player-android
    env:
      SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Check this hasn't been done already
        id: check
        run: |
          # Asked for by hand: say why not. Started by a push: just skip.
          level=notice; fail=0
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then level=error; fail=1; fi
          if [ -e signing/release.keystore.gpg ] || [ -e signing/rotation.lineage ]; then
            echo "::$level::The signing key already exists. Making a new one would stop phones from updating."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit $fail
          fi
          if [ "${#SIGNING_PASSPHRASE}" -lt 20 ]; then
            echo "::$level::Add a SIGNING_PASSPHRASE repository secret of at least 20 characters first."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit $fail
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Make the key and the rotation record
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          key="$RUNNER_TEMP/release.p12"
          keytool -genkeypair -keystore "$key" -storetype PKCS12 -alias isaialai \
            -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Isaialai" \
            -storepass:env SIGNING_PASSPHRASE -keypass:env SIGNING_PASSPHRASE
          # Proof, signed by the old key, that the new key takes over. Holds only public certificates.
          "$apksigner" rotate --out signing/rotation.lineage \
            --old-signer --ks signing/sideload.keystore --ks-key-alias mymusic --ks-pass pass:mymusic \
            --new-signer --ks "$key" --ks-key-alias isaialai --ks-pass env:SIGNING_PASSPHRASE
          "$apksigner" lineage --in signing/rotation.lineage --print-certs
          printf '%s' "$SIGNING_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            --output signing/release.keystore.gpg "$key"
          # Check the encrypted copy opens before throwing the plain one away.
          printf '%s' "$SIGNING_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt signing/release.keystore.gpg | cmp - "$key"
          shred -u "$key"
      - name: Commit
        if: steps.check.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add signing/release.keystore.gpg signing/rotation.lineage
          git commit -m "Add Isaialai's encrypted signing key and key-rotation record"
          git push origin "HEAD:${GITHUB_REF_NAME}"
