name: Music player APK

on:
  push:
    paths:
      - "music-player-android/**"
      - ".github/workflows/music-player-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-player-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-player-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Sign with Isaialai's own key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          built=app/build/outputs/apk/release/app-release.apk
          mkdir -p old-key
          cp "$built" old-key/old-key-only.apk  # for the update test only; never published
          if [ ! -e signing/release.keystore.gpg ]; then
            echo "::warning::No private signing key yet, so this build is signed with the old public key. See music-player-android/SECURITY.md."
            cp "$built" Isaialai.apk
            exit 0
          fi
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::error::The SIGNING_PASSPHRASE secret is missing, so the APK can't be signed."
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          key="$RUNNER_TEMP/release.p12"
          trap 'shred -u "$key" 2>/dev/null || true' EXIT
          printf '%s' "$SIGNING_PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output "$key" signing/release.keystore.gpg
          # Older Android (before 9) checks the old key; Android 9+ checks the new one, plus the
          # record that the old key handed over to it, so installed copies update in place.
          "$apksigner" sign --in "$built" --out Isaialai.apk \
            --v4-signing-enabled false \
            --ks signing/sideload.keystore --ks-key-alias mymusic --ks-pass pass:mymusic \
            --next-signer --ks "$key" --ks-key-alias isaialai --ks-pass env:SIGNING_PASSPHRASE \
            --lineage signing/rotation.lineage --rotation-min-sdk-version 28
          report=$("$apksigner" verify --verbose --print-certs Isaialai.apk)
          echo "$report" | grep -E "Verified using|certificate DN" || true
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" <<<"$report" \
            || { echo "::error::The APK has no v3 signature"; exit 1; }
          "$apksigner" lineage --in Isaialai.apk --print-certs | tee lineage.txt
          signers=$(grep -oE "^Signer #[0-9]+" lineage.txt | sort -u | wc -l)
          [ "$signers" -eq 2 ] || { echo "::error::Expected the old and new key in the APK's signing history, found $signers"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MyMusic-apk
          path: music-player-android/Isaialai.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: old-key-apk
          path: music-player-android/old-key/old-key-only.apk
          retention-days: 3

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MyMusic-apk
          path: apk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: old-key-apk
          path: old-key
      - name: Make test songs
        timeout-minutes: 10
        run: |
          set -x
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p songs
          for i in 1 2 3; do
            ffmpeg -nostdin -loglevel error -f lavfi -i "sine=frequency=$((300 + i * 110)):duration=60" -c:a libmp3lame \
              -metadata title="Smoke Song $i" -metadata artist="CI Band" -metadata album="CI Album" -metadata track=$i \
              -metadata composer="CI Composer" -metadata date=2021 \
              "songs/song$i.mp3"
          done
          # a 12-song album for the shuffle test
          for i in $(seq -w 1 12); do
            ffmpeg -nostdin -loglevel error -f lavfi -i "sine=frequency=$((200 + 10#$i * 40)):duration=60" -c:a libmp3lame \
              -metadata title="Tune $i" -metadata artist="Shuffle Band" -metadata album="Shuffle Album" -metadata track=$((10#$i)) \
              -metadata composer="CI Composer" \
              "songs/tune$i.mp3"
          done
          # a much louder song, for even volume
          ffmpeg -nostdin -loglevel error -f lavfi -i "sine=frequency=500:duration=60" -af volume=7 -c:a libmp3lame \
            -metadata title="Loud Song" -metadata artist="Loud Band" -metadata album="Loud Album" songs/loud.mp3
          # the same song saved twice (in two folders), for the duplicate finder
          ffmpeg -nostdin -loglevel error -f lavfi -i "sine=frequency=880:duration=45" -c:a libmp3lame \
            -metadata title="Twin Song" -metadata artist="Twin Band" -metadata album="Twin Album" songs/twin.mp3
          # Android marks songs in a Podcasts folder as "not music"
          ffmpeg -nostdin -loglevel error -f lavfi -i "sine=frequency=660:duration=60" -c:a libmp3lame \
            -metadata title="Smoke Podcast Song" -metadata artist="CI Band" -metadata album="CI Extras" songs/podcast.mp3
          # goes in a folder with a .nomedia file, which Android's media library skips
          ffmpeg -nostdin -loglevel error -f lavfi -i "sine=frequency=770:duration=60" -c:a libmp3lame \
            -metadata title="Smoke Hidden Song" -metadata artist="Hidden Band" -metadata album="Hidden Album" songs/hidden.mp3
          # timed lyrics next to it, as an .lrc file
          printf '%s\n' "[ti:Smoke Hidden Song]" "[00:00.50]First line of the hidden song" "[00:05.00]Second line here" \
            "[00:20.00]Twenty seconds in" "[00:40.00]Last line" > songs/hidden.lrc
          # plain lyrics saved inside a song (an ID3 USLT frame)
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet mutagen==1.47.0
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          from mutagen.id3 import ID3, USLT
          tags = ID3("songs/song2.mp3")
          tags.add(USLT(encoding=3, lang="eng", desc="", text="Smoke lyrics line one\nSmoke lyrics line two"))
          tags.save()
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run on an Android 14 emulator
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            bash music-player-android/ci/update-test.sh old-key/old-key-only.apk apk/Isaialai.apk
            bash music-player-android/ci/smoke-test.sh apk/Isaialai.apk songs smoke-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-test-screens
          path: smoke-out

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MyMusic-apk
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smoke-test-screens
          path: out/screens
      - name: Publish the APK as the "music-player-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete music-player-latest --cleanup-tag --yes || true
          # Keep the old file name too, so links shared before the rename still work.
          cp out/Isaialai.apk out/MyMusic.apk
          gh release create music-player-latest out/Isaialai.apk out/MyMusic.apk out/screens/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Isaialai for Android (build ${{ github.run_number }})" \
            --notes "Download **Isaialai.apk** on your Android phone, open it, and allow installing from your browser when asked. Each new build installs as an update over the last one. The PNG files are screenshots from the automatic emulator test of this build. MyMusic.apk is the same file under the old name."
